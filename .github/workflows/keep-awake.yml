# The free Render server sleeps after 15 idle minutes and takes ~50 s to wake.
# This pings it every 10 minutes during Indian daytime so the demo never waits.
name: keep-awake
on:
  schedule:
    - cron: "*/10 1-17 * * *"   # 06:30-23:30 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: docs/config.js }
      - name: Ping the API
        run: |
          url=$(grep -o 'MESS_CLOUD_API = "[^"]*"' docs/config.js | cut -d'"' -f2)
          [ -n "$url" ] || { echo "MESS_CLOUD_API not set in docs/config.js yet"; exit 0; }
          echo "Pinging $url/health"
          curl -fsS --max-time 90 "$url/health" || echo "API not reachable (not deployed yet?)"
