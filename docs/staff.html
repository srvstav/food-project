<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Staff Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tools.css">
</head>
<body>
<header class="bar">
  <h1>Staff <em>counter</em></h1>
  <nav><a href="index.html">Student site</a><a href="dashboard.html">Live board</a></nav>
</header>

<div class="staff">
  <!-- PIN gate -->
  <section class="card" id="gate">
    <h2><span>Staff only</span></h2>
    <form class="pad" id="pin-form">
      <div class="field"><label for="pin">Staff PIN (printed by setup)</label>
        <input id="pin" class="big-input" inputmode="numeric" autocomplete="off" maxlength="12" required></div>
      <button class="btn">Unlock</button>
    </form>
  </section>

  <div id="desk" hidden>
    <section class="card">
      <h2><span>Serving now</span><span id="clock"></span></h2>
      <div class="pad">
        <div class="row2">
          <div class="field"><label for="mess">Mess</label><select id="mess"></select></div>
          <div class="field"><label for="slot">Meal</label><select id="slot"></select></div>
        </div>
        <form id="serve-form" class="field">
          <label for="phone">Student's phone number</label>
          <input id="phone" class="big-input" inputmode="numeric" maxlength="10" placeholder="98765 43210" autocomplete="off" required>
          <button class="btn">Serve ✓</button>
        </form>
        <div id="result" class="result" hidden></div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <h2><span>This meal so far</span><code>v_meal_summary</code></h2>
      <div class="kpis">
        <div class="kpi"><div class="n" id="k-booked">0</div><div class="l">booked here</div></div>
        <div class="kpi"><div class="n" id="k-cook">0</div><div class="l">cooked (× 1.3)</div></div>
        <div class="kpi"><div class="n" id="k-served">0</div><div class="l">served</div></div>
        <div class="kpi"><div class="n" id="k-walk">0</div><div class="l">walk-ins</div></div>
      </div>
      <div class="pad">
        <button class="btn danger" id="close">Meal over - close it and send leftovers to NGOs</button>
        <div id="donated" class="result ok" hidden></div>
      </div>
    </section>
  </div>
</div>
<p id="toast" role="status"></p>

<script src="config.js"></script>
<script src="shared.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let pin = sessionStorage.getItem("staff_pin") || "";
  const staff = (path, opts = {}) => apiFetch(path, { ...opts, headers: { "X-Staff-Pin": pin } });

  async function unlock() {
    await staff("/staff/check");
    sessionStorage.setItem("staff_pin", pin);
    const menu = await apiFetch("/menu");
    $("mess").innerHTML = menu.slots[0].messes.map(m => `<option value="${m.mess_id}">${m.name}</option>`).join("");
    $("slot").innerHTML = menu.slots.map(s => `<option value="${s.slot_id}">${s.name} (${s.starts_at}-${s.ends_at})</option>`).join("");
    // Pick the meal being served now, or the next one.
    const t = istTime();
    const current = menu.slots.find(s => t <= s.ends_at) || menu.slots[menu.slots.length - 1];
    $("slot").value = current.slot_id;
    $("mess").value = sessionStorage.getItem("staff_mess") || "1";
    $("gate").hidden = true;
    $("desk").hidden = false;
    $("phone").focus();
    refresh();
    setInterval(refresh, 3000);
  }

  $("pin-form").addEventListener("submit", async e => {
    e.preventDefault();
    pin = $("pin").value.trim();
    try { await unlock(); } catch (err) { toast(err.message); }
  });
  if (pin) unlock().catch(() => sessionStorage.removeItem("staff_pin"));

  $("mess").addEventListener("change", () => { sessionStorage.setItem("staff_mess", $("mess").value); refresh(); });
  $("slot").addEventListener("change", refresh);
  $("phone").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10); });

  function showResult(kind, title, sub) {
    const r = $("result");
    r.className = `result ${kind}`;
    r.hidden = false;
    r.textContent = title;
    if (sub) { const s = document.createElement("small"); s.textContent = sub; r.append(s); }
  }

  $("serve-form").addEventListener("submit", async e => {
    e.preventDefault();
    const phone = $("phone").value;
    if (!/^[6-9]\d{9}$/.test(phone)) return showResult("err", "Enter a 10-digit number");
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    try {
      const r = await staff("/staff/serve", { method: "POST", body: { phone, mess_id: +$("mess").value, slot_id: +$("slot").value } });
      if (r.booked_here) showResult("ok", "Booked here - serve ✓", `${r.name} · +91 ${phone}`);
      else showResult("walk", "Walk-in - serve from the buffer",
        `${r.name} · ` + (r.booking === "none" ? "no booking for this meal" : `their booking: ${r.booking}`));
      $("phone").value = "";
      refresh();
    } catch (err) {
      showResult("err", err.message);
    } finally {
      btn.disabled = false;
      $("phone").focus();
    }
  });

  $("close").addEventListener("click", async e => {
    const slotName = $("slot").selectedOptions[0].textContent.split(" (")[0];
    if (!confirm(`Close ${slotName} for both messes and assign leftovers to NGOs?`)) return;
    const btn = e.currentTarget;  // currentTarget is null after the first await
    btn.disabled = true;
    try {
      const r = await staff("/staff/close-meal", { method: "POST", body: { meal_date: istDay(0), slot_id: +$("slot").value } });
      const box = $("donated");
      box.hidden = false;
      box.textContent = r.donations.length
        ? r.donations.map(d => `${d.portions} portions from ${d.mess} → ${d.ngo} (${d.area})`).join("\n")
        : "Nothing left over to donate.";
      box.style.whiteSpace = "pre-line";
      refresh();
    } catch (err) { toast(err.message); }
    finally { btn.disabled = false; }
  });

  async function refresh() {
    $("clock").textContent = istTime() + " IST";
    try {
      const d = await apiFetch("/admin/live?limit=1");
      const row = d.summary.find(r => r.mess_id === +$("mess").value && r.slot_id === +$("slot").value) || {};
      $("k-booked").textContent = row.booked || 0;
      $("k-cook").textContent = row.cooked || 0;
      $("k-served").textContent = row.served || 0;
      $("k-walk").textContent = row.walk_ins || 0;
    } catch {}
  }
</script>
</body>
</html>
