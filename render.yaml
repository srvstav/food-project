# Render Blueprint: the API as a free web service.
# Deploy: https://dashboard.render.com/blueprint/new  → pick this repo.
# Values marked sync:false are asked for once; paste them from backend/.env.render (made by `setup.bat cloud`).
services:
  - type: web
    name: mess-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: mess
      - key: DB_SSL_CA_PEM
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: STAFF_PIN
        sync: false
      - key: OTP_MODE
        value: dev
      - key: ALLOWED_ORIGINS
        value: "*"
