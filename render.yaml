# Render Blueprint: the Java API + website as one free web service (built from the Dockerfile).
# Deploy: https://dashboard.render.com/blueprint/new → pick this repo → paste MESS_SETTINGS → Apply.
# MESS_SETTINGS is the single line that setup_cloud.bat copies to the clipboard (also in RENDER_VALUE.txt).
services:
  - type: web
    name: mess-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: MESS_SETTINGS
        sync: false
